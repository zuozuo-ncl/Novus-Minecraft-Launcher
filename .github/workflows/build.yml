name: Build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher (Java)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'MC launcher/pom.xml'

      - name: 构建 shaded jar
        working-directory: MC launcher
        run: mvn -B -ntp package

      # 文件名由 pom 的 shade outputFile 决定，版本号变化时不用改工作流：
      # 优先取 *-shaded.jar，没有就取 target 下体积最大的 jar。
      - name: 定位产物并计算哈希
        working-directory: MC launcher
        shell: pwsh
        run: |
          $jars = @()
          if (Test-Path target) {
            $jars = Get-ChildItem target -Filter '*.jar' |
              Where-Object { $_.Name -notmatch '-(sources|javadoc)\.jar$' } |
              Sort-Object Length -Descending
          }
          $jar = $jars | Where-Object { $_.Name -like '*-shaded.jar' } | Select-Object -First 1
          if (-not $jar) { $jar = $jars | Select-Object -First 1 }
          if (-not $jar) { throw '没有生成任何 jar，请检查 mvn package 的输出' }

          $hash = (Get-FileHash $jar.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "$($jar.Name)  $([math]::Round($jar.Length/1MB,1)) MB  SHA256=$hash"
          "JAR_PATH=$($jar.FullName)" >> $env:GITHUB_ENV

      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: launcher-jar
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error

  bootstrapper:
    name: Bootstrapper (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: UCRT64
            mingw: /ucrt64
            artifact: MCLauncherBootstrap.exe
          - arch: x86
            msystem: MINGW32
            mingw: /mingw32
            artifact: MCLauncherBootstrap_x86.exe
    defaults:
      run:
        working-directory: bootstrapper
    steps:
      - uses: actions/checkout@v4

      - name: 准备工具链（${{ matrix.msystem }}）
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            ${{ (matrix.arch == 'x64' && 'mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja')
                || 'mingw-w64-i686-gcc mingw-w64-i686-cmake mingw-w64-i686-ninja' }}

      - name: 配置
        shell: msys2 {0}
        run: |
          export PATH=${{ matrix.mingw }}/bin:$PATH
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_RC_COMPILER=windres

      - name: 编译
        shell: msys2 {0}
        run: |
          export PATH=${{ matrix.mingw }}/bin:$PATH
          cmake --build build --config Release
          mkdir -p out
          cp bin/MCLauncherBootstrap.exe "out/${{ matrix.artifact }}"

      - name: 产物信息
        shell: pwsh
        run: |
          $exe = "out/${{ matrix.artifact }}"
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          $f = Get-Item $exe
          Write-Host "$($f.Name)  $([math]::Round($f.Length/1MB,1)) MB  SHA256=$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())"

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: bootstrapper-${{ matrix.arch }}
          path: bootstrapper/out/${{ matrix.artifact }}
          if-no-files-found: error

  relay:
    name: Relay (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # go.mod 里没有第三方依赖，不配置模块缓存
          go-version-file: mc-relay-go/go.mod
          cache: false

      - name: 编译（amd64 / arm64）
        working-directory: mc-relay-go
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o dist/relay-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o dist/relay-linux-arm64 .
          sha256sum dist/*

      - name: 上传中继二进制
        uses: actions/upload-artifact@v4
        with:
          name: relay-go
          path: mc-relay-go/dist/relay-linux-*
          if-no-files-found: error

  release:
    name: Release
    needs: [launcher, bootstrapper, relay]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mc-launcher-*.jar
            dist/MCLauncherBootstrap.exe
            dist/MCLauncherBootstrap_x86.exe
            dist/relay-linux-amd64
            dist/relay-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ### 下载
            - `mc-launcher-*-shaded.jar` — 启动器（需要 Java 17）
            - `MCLauncherBootstrap.exe` — 引导器 x64（自带 Java 检测与下载）
            - `MCLauncherBootstrap_x86.exe` — 引导器 32 位
            - `relay-linux-amd64` / `relay-linux-arm64` — 联机中继服务器

            校验：`sha256sum -c SHA256SUMS`